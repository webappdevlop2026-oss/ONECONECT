name: Deploy Healthcare from tested source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-healthcare-oct10.yml

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deploy repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          repository: webappdevlop2026-oss/oneconect-source
          ref: 1d0f3f9905d1737ae9c1463111d881dbec2390ca
          path: source

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Build tested source
        working-directory: source
        run: |
          flutter pub get
          flutter test test/client_booking_forms_test.dart
          flutter build web --release --no-wasm-dry-run

      - name: Copy web build without touching admin
        run: |
          rsync -a source/build/web/ ./             --exclude '.git/'             --exclude '.github/'             --exclude 'admin/'             --exclude 'vercel.json'             --exclude '.last_build_id'
          rm -rf source
          rm -f .github/workflows/deploy-healthcare-oct10.yml

      - name: Commit deploy
        run: |
          git config user.name "ONECONECT Deploy"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Deploy Healthcare service boxes and city-first forms"
          git push origin HEAD:main
